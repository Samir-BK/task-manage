name: Continuous Integration

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build backend
        run: npm run build:backend

      - name: Build frontend
        run: npm run build:frontend

      - name: Run backend tests
        run: npm run test:backend

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Lint backend
        run: npm run lint:backend

      - name: Lint frontend
        run: npm run lint:frontend
  docker:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend Docker image
        run: docker buildx build --load -t task-manage-backend:ci -f backend/Dockerfile .

      - name: Build frontend Docker image
        run: docker buildx build --load --build-arg VITE_API_URL=http://localhost:5001/api -t task-manage-frontend:ci -f frontend/Dockerfile .
  publish:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag ghcr.io/samir-bk/task-manage-backend:latest \
            --tag ghcr.io/samir-bk/task-manage-backend:${{ github.sha }} \
            --label org.opencontainers.image.source=https://github.com/Samir-BK/task-manage \
            --push \
            -f backend/Dockerfile .

      - name: Build and publish frontend image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VITE_API_URL=http://localhost:5001/api \
            --tag ghcr.io/samir-bk/task-manage-frontend:latest \
            --tag ghcr.io/samir-bk/task-manage-frontend:${{ github.sha }} \
            --label org.opencontainers.image.source=https://github.com/Samir-BK/task-manage \
            --push \
            -f frontend/Dockerfile .